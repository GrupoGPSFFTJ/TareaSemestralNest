version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - FRONTEND_URL=http://localhost:5173
    volumes:
      - ./backend/data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:3000
    ports:
      - "5173:80"
    environment:
      - VITE_API_URL=http://localhost:3000
    restart: unless-stopped

# Notes:
# - Backend's SQLite data is mounted to ./backend/data to persist between restarts.
# - The frontend is served by nginx on container port 80 and mapped to host 5173.
# - If you change ports, update `FRONTEND_URL` in the backend env accordingly.